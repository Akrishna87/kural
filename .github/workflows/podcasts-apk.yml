name: Podwave podcasts APK

on:
  push:
    paths:
      - "**"
      - ".github/workflows/podcasts-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: podcasts-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Unit tests and the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Podwave.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Podwave-apk
          path: Podwave.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Podwave-apk
          path: apk
      - name: Install ffmpeg (for the test show's audio)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and run on an Android 14 emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: |
            bash ci/smoke-test.sh apk/Podwave.apk smoke-out
            bash ci/updater-test.sh apk/Podwave.apk smoke-out/updater
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: podcasts-smoke-test-screens
          path: |
            smoke-out/*.png
            smoke-out/*.xml
            smoke-out/*.txt
            smoke-out/*.log
            smoke-out/updater/*.png
            smoke-out/updater/*.xml
            smoke-out/updater/*.txt

  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Podwave-apk
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: podcasts-smoke-test-screens
          path: out/screens
      - name: Describe the build for the in-app updater
        run: |
          # Settings > App updates reads this file; versionCode matches the build number that was
          # passed to Gradle as VERSION_CODE.
          cat > out/version.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apk": "Podwave.apk",
            "sha256": "$(sha256sum out/Podwave.apk | cut -d' ' -f1)",
            "size": $(stat -c %s out/Podwave.apk)
          }
          EOF
          cat out/version.json
          python3 -c "import json; json.load(open('out/version.json'))"
      - name: Publish the APK as the "podcasts-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete podcasts-latest --cleanup-tag --yes || true
          gh release create podcasts-latest out/Podwave.apk out/version.json out/screens/*.png \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Podwave podcasts for Android (build ${{ github.run_number }})" \
            --notes "Download **Podwave.apk** on your Android phone, open it, and allow installing from your browser when asked. Each new build installs as an update over the last one. The PNG files are screenshots from the automatic emulator test of this build."
